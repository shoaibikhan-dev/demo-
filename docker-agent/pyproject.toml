[project]
name = "docker-agent"
version = "0.1.0"
description = "Prototype CLI for generating Dockerfiles with Anthropic"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "anthropic>=0.30.0",
  "python-dotenv>=1.0.0",
  "qdrant-client>=1.13.0",
]

[project.scripts]
docker-agent = "main:app"

[tool.setuptools]
py-modules = ["main", "agent"]

[tool.setuptools.packages.find]
include = ["rag*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
